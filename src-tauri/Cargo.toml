[package]
name = "jtech-browser"
version = "0.8.3"
description = "JTech Browser (Tauri)"
authors = ["bartels"]
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# "unstable" enables multiwebview (Window::add_child, WebviewBuilder).
# Pinned to 2.12.x so the webview2-com version below stays in sync with Tauri.
tauri = { version = "~2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Must match the versions used by tauri / wry (see Cargo.lock).
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
